<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block subject %}New KB article published: {{ title }}{% endblock %}</title>
</head>
<body style="font-family:Arial,sans-serif;color:#333;max-width:600px;margin:0 auto;padding:24px;">
{% block body %}
<h2 style="color:#1a56db;">New Knowledge Base Article</h2>
<p>A new article has been published in the Knowledge Base.</p>
<p><strong>{{ title }}</strong></p>
{% if body %}<p>{{ body }}</p>{% endif %}
<p style="margin-top:24px;color:#6b7280;font-size:12px;">You are receiving this because you are subscribed to KB article notifications.</p>
{% endblock %}
</body>
</html>
