<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block subject %}Ticket {{ ticket_number }} has been assigned to you{% endblock %}</title>
</head>
<body style="font-family:Arial,sans-serif;color:#333;max-width:600px;margin:0 auto;padding:24px;">
{% block body %}
<h2 style="color:#1a56db;">Ticket Assigned</h2>
<p>Ticket <strong>{{ ticket_number }}</strong> has been assigned to you.</p>
{% if title %}<p><strong>Subject:</strong> {{ title }}</p>{% endif %}
{% if body %}<p>{{ body }}</p>{% endif %}
<p style="margin-top:24px;color:#6b7280;font-size:12px;">You are receiving this because you are the assigned agent on this ticket.</p>
{% endblock %}
</body>
</html>
