services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    # Runtime connects as the restricted, NON-superuser itsm_app role so
    # Row-Level Security actually engages (superusers bypass RLS). Migrations
    # are still run as the owning itsm_user (e.g. `docker exec -e DATABASE_URL=
    # postgresql+asyncpg://itsm_user:...@db:5432/itsm_db api alembic upgrade head`).
    environment:
      DATABASE_URL: postgresql+asyncpg://itsm_app:itsm_app_pass@db:5432/itsm_db
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://itsm_app:itsm_app_pass@db:5432/itsm_db
    depends_on:
      - db
      - redis

  worker-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://itsm_app:itsm_app_pass@db:5432/itsm_db
    depends_on:
      - redis

  db:
    # DEV ONLY — not deployed in prod (use shared Project-IQ PostgreSQL server instead)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: itsm_user
      POSTGRES_PASSWORD: itsm_pass
      POSTGRES_DB: itsm_db
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
