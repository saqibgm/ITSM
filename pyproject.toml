[project]
name = "itsm-service"
version = "1.0.0"
description = "IQ-ITSM Service — multi-tenant ITSM platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.4",
    "anthropic>=0.28",
    "openai>=1.30",
    "pgvector>=0.3",
    "python-jose[cryptography]>=3.3",
    "httpx[socks]>=0.27",  # [socks] pulls in socksio — lets refresh_jwks() use a
    # SOCKS proxy for IAM_JWKS_PROXY (see app/auth/jwks.py) if that host's own
    # network can't reach the IAM JWKS endpoint directly.
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "jsonschema>=4.22",
    "prometheus-fastapi-instrumentator>=7.0",
    "uuid7>=0.1",
    "boto3>=1.34",
    "pydantic-settings>=2.3",
    "python-socketio[asyncio_client]>=5.11",
    "sentry-sdk[fastapi]>=2.5",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "opentelemetry-instrumentation-asyncpg>=0.45b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx[asyncio]>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "cryptography>=42",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
select = ["E", "W", "F", "I"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
