# LOCAL-ONLY override (auto-loaded by `docker compose`, NOT deployed to prod).
# Keep the whole stack auto-restarting across host/Docker reboots for local
# dev — db already had this, but api/worker/worker-beat/redis/minio didn't,
# so every Docker Desktop restart or machine sleep/wake left everything but
# the db dead until someone noticed and manually ran `docker compose up`
# again (surfacing as "itsm-service unreachable: ConnectionError" in
# Project IQ's admin API, since it depends on itsm-service's api container).
services:
  db:
    restart: unless-stopped
  api:
    restart: unless-stopped
  worker:
    restart: unless-stopped
  worker-beat:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
